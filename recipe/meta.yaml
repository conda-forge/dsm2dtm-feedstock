{% set name = "dsm2dtm" %}
{% set version = "0.4.0" %}
{% set python_min = "3.11" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 7a8acfad6e5ea1127b37069ba92931edf5275fb707a626906c125da8bee851aa

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools >=61.0
  run:
    - python >={{ python_min }}
    - numpy >=1.21
    - rasterio >=1.3
    - scipy >=1.8
    - pyproj >=3.4

test:
  imports:
    - dsm2dtm
  commands:
    - pip check
    - dsm2dtm --help
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/seedlit/dsm2dtm
  summary: Generate DTM (Digital Terrain Model) from DSM (Digital Surface Model)
  license: MIT
  license_file: LICENSE
  doc_url: https://github.com/seedlit/dsm2dtm#readme
  dev_url: https://github.com/seedlit/dsm2dtm

extra:
  recipe-maintainers:
    - seedlit
    - r1j1t
